<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Nexus AI Screen Blue Theme</title>
  <desc id="desc">Consumer-friendly AI preferences screen in soft blue with white cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FAFF"/>
      <stop offset="100%" stop-color="#EAF3FF"/>
    </linearGradient>
    <style>
      .h1 { font: 700 50px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #163B66; }
      .h2 { font: 700 33px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #163B66; }
      .t1 { font: 600 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1E4D83; }
      .t2 { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #486E98; }
      .btn { font: 700 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1A487A; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="72" y="116" class="h1">Nexus AI</text>
  <text x="72" y="162" class="t2">Helpful guidance for your transfers</text>

  <rect x="56" y="210" rx="30" ry="30" width="968" height="250" fill="#CFE7FF"/>
  <text x="92" y="286" class="h2">AI guidance</text>
  <text x="92" y="330" class="t2">Tone: Calm and concise</text>
  <text x="92" y="370" class="t2">Detail level: Balanced</text>
  <rect x="810" y="268" rx="24" ry="24" width="178" height="56" fill="#DFF4E4"/>
  <text x="870" y="304" class="t1">On</text>

  <rect x="56" y="490" rx="28" ry="28" width="968" height="280" fill="#FFFFFF" stroke="#D7E8F9" stroke-width="2"/>
  <text x="92" y="558" class="h2">Where Nexus AI helps</text>
  <text x="92" y="608" class="t2">Home: transfer readiness and reassurance</text>
  <text x="92" y="648" class="t2">Send: Cheapest vs Most Stable explanation</text>
  <text x="92" y="688" class="t2">Transfers: status explanation and next step guidance</text>

  <rect x="56" y="800" rx="28" ry="28" width="968" height="356" fill="#FFFFFF" stroke="#D7E8F9" stroke-width="2"/>
  <text x="92" y="868" class="h2">Sensitivity</text>

  <rect x="92" y="902" rx="18" ry="18" width="278" height="90" fill="#FFFFFF" stroke="#D7E8F9" stroke-width="2"/>
  <text x="160" y="958" class="btn">Low</text>

  <rect x="392" y="902" rx="18" ry="18" width="304" height="90" fill="#EAF4FF" stroke="#2C7EDB" stroke-width="3"/>
  <text x="486" y="958" class="btn">Balanced</text>

  <rect x="718" y="902" rx="18" ry="18" width="270" height="90" fill="#FFFFFF" stroke="#D7E8F9" stroke-width="2"/>
  <text x="822" y="958" class="btn">High</text>

  <text x="92" y="1044" class="t2">Balanced is recommended for clear and calm guidance.</text>

  <rect x="56" y="1188" rx="24" ry="24" width="968" height="84" fill="#2C7EDB"/>
  <text x="450" y="1242" fill="#FFFFFF" font="700 24px 'Segoe UI', Arial, sans-serif">Save preferences</text>

  <rect x="48" y="1724" rx="32" ry="32" width="984" height="136" fill="#FFFFFF" stroke="#D7E8F9" stroke-width="2"/>
  <text x="118" y="1806" class="t2">Home</text>
  <text x="306" y="1806" class="t2">Send</text>
  <text x="474" y="1806" class="t2">Transfers</text>
  <text x="700" y="1806" class="t2">Profile</text>
  <text x="874" y="1806" class="t1">Settings</text>
</svg>
