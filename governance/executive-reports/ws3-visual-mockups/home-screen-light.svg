<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">NexusPay Home Screen Light Mockup</title>
  <desc id="desc">Warm and friendly private user home screen wireframe visual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EF"/>
      <stop offset="100%" stop-color="#FFF3E4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE5C8"/>
      <stop offset="100%" stop-color="#FFD9B0"/>
    </linearGradient>
    <style>
      .h1 { font: 700 48px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5B3A1F; }
      .h2 { font: 700 36px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5B3A1F; }
      .t1 { font: 600 28px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #714A2A; }
      .t2 { font: 500 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8B6544; }
      .small { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8E6C4F; }
      .btn { font: 700 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .pill { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6A4325; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="180" fill="#FFFDF9"/>
  <text x="72" y="88" class="h1">Good afternoon, Tayo</text>
  <text x="72" y="138" class="t2">Your money movement is ready</text>
  <rect x="842" y="58" rx="26" ry="26" width="170" height="56" fill="#FFE9D1"/>
  <text x="874" y="95" class="pill">Personal</text>

  <rect x="56" y="214" rx="34" ry="34" width="968" height="280" fill="url(#hero)"/>
  <text x="96" y="286" class="small">Available to send</text>
  <text x="96" y="356" class="h1">GBP 1,240.00</text>
  <rect x="96" y="396" rx="20" ry="20" width="262" height="68" fill="#F4A259"/>
  <text x="146" y="440" class="btn">Send money</text>
  <rect x="382" y="396" rx="20" ry="20" width="324" height="68" fill="#FFFFFF" stroke="#F4A259" stroke-width="2"/>
  <text x="425" y="440" class="pill">Add funding source</text>

  <rect x="56" y="528" rx="28" ry="28" width="968" height="220" fill="#FFFDF8" stroke="#F4D8BA" stroke-width="2"/>
  <text x="96" y="594" class="h2">Nexus AI</text>
  <text x="96" y="646" class="t2">Your usual Philippines transfer is stable today.</text>
  <text x="96" y="688" class="t2">Most Stable is recommended if delivery certainty matters.</text>

  <rect x="56" y="778" rx="28" ry="28" width="968" height="246" fill="#FFFFFF" stroke="#F4D8BA" stroke-width="2"/>
  <text x="96" y="844" class="h2">Active transfer</text>
  <text x="96" y="892" class="t1">Maria Santos</text>
  <rect x="796" y="854" rx="16" ry="16" width="168" height="48" fill="#DFF4E4"/>
  <text x="828" y="886" class="pill" fill="#2F7C4A">COMPLETED</text>
  <text x="96" y="938" class="t2">GBP 250.00 -> PHP</text>
  <rect x="96" y="962" rx="18" ry="18" width="218" height="54" fill="#FFF3E3"/>
  <text x="138" y="997" class="pill">View transfer</text>

  <rect x="56" y="1054" rx="28" ry="28" width="968" height="430" fill="#FFFFFF" stroke="#F4D8BA" stroke-width="2"/>
  <text x="96" y="1122" class="h2">Recent transfers</text>
  <line x1="96" y1="1160" x2="984" y2="1160" stroke="#F4E1CC" stroke-width="2"/>
  <text x="96" y="1220" class="t1">Maria Santos</text>
  <text x="96" y="1262" class="t2">NXP-2026-004981</text>
  <text x="806" y="1228" class="pill">Completed</text>

  <line x1="96" y1="1302" x2="984" y2="1302" stroke="#F4E1CC" stroke-width="2"/>
  <text x="96" y="1360" class="t1">Ahmed Khan</text>
  <text x="96" y="1402" class="t2">NXP-2026-004877</text>
  <text x="806" y="1368" class="pill">Completed</text>

  <rect x="96" y="1430" rx="18" ry="18" width="278" height="54" fill="#FFF3E3"/>
  <text x="136" y="1465" class="pill">View all transfers</text>

  <rect x="48" y="1724" rx="32" ry="32" width="984" height="136" fill="#FFFDF9" stroke="#F4D8BA" stroke-width="2"/>
  <text x="118" y="1806" class="t1">Home</text>
  <text x="306" y="1806" class="t2">Send</text>
  <text x="474" y="1806" class="t2">Transfers</text>
  <text x="700" y="1806" class="t2">Profile</text>
  <text x="874" y="1806" class="t2">Settings</text>
</svg>
